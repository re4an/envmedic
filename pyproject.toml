[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "re4an-envmedic"
authors = [{ name = "re4an" }]
dynamic = ["version"]
description = "Check your .env file against .env.example: missing, extra, empty and duplicate keys."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["dotenv", "env", "cli", "lint", "configuration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/re4an/envmedic"
Issues = "https://github.com/re4an/envmedic/issues"

[project.scripts]
envmedic = "envmedic.cli:main"

[tool.setuptools.dynamic]
version = { attr = "envmedic.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
